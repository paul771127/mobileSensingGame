<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機球拍對戰</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="center">
  <h1 style="margin:0">🎾 手機球拍對戰</h1>
  <p class="muted" style="max-width:520px">電視或電腦開「顯示端」顯示球場；兩支手機掃畫面上的 QR code 當球拍。顯示端可以在多台螢幕同時打開，房號相同即可同步。</p>
  <a class="btn" href="/display">我是電視 / 電腦（顯示端）</a>
  <a class="btn secondary" href="/controller">我是手機（球拍）</a>
  <hr style="width:100%;max-width:520px;border:0;border-top:1px solid #2a3560;margin:8px 0">
  <h2 style="margin:0">🏝 島口大開</h2>
  <p class="muted" style="max-width:520px">1～4 人同屏合作闖關：三個小關清怪、全隊共用擊倒數升級選技能、最後合力擊碎方塊巨怪的核心。手機傾斜走位、短抬跳躍，靠近自動敲。</p>
  <a class="btn" href="/island">島口大開 — 電腦顯示端</a>
  <a class="btn secondary" href="/island/controller">島口大開 — 手機控制器</a>
  <p class="muted" style="font-size:14px">iPhone 需要以 HTTPS 連線才能使用動作感測器。</p>
</div>
</body>
</html>
